const input = document.getElementById("zip");
const result = document.getElementById("result");
const byAll = new Set(DATA.byAll);

document.getElementById("version").textContent = `v${VERSION} · Data: ${DATA.label}`;

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Oregon counties are stored bare ("Multnomah"); out-of-state ones already carry their state.
const fullName = n => n.includes(", ") ? n : `${n} County`;

function show(raw) {
  const zip = raw.replace(/\D/g, "").slice(0, 5);
  if (zip !== raw) input.value = zip;
  if (zip.length < 5) { result.innerHTML = ""; return; }
  if (!/^97\d{3}$/.test(zip)) { result.innerHTML = `<div class="msg">Not an Oregon ZIP.</div>`; return; }
  const counties = DATA.zips[zip];
  if (!counties) {
    result.innerHTML = `<div class="msg">Not found — may be a PO Box-only or new ZIP.</div>`;
    return;
  }
  const basis = byAll.has(zip) ? `<div class="note">(by all addresses)</div>` : "";
  if (counties.length === 1) {
    result.innerHTML = `<div class="single">${esc(fullName(counties[0][0]))}</div>${basis}`;
    return;
  }
  const rows = counties.map(([n, p]) =>
    `<li><span>${esc(n)}</span><span class="pct">${p}%</span></li>`).join("");
  result.innerHTML = `<div class="split"><div class="banner">Spans ${counties.length} counties — check the address</div>` +
    `<ul>${rows}</ul></div>${basis}`;
}

input.addEventListener("input", () => show(input.value));
// Tapping the field after a lookup clears it for the next ZIP.
input.addEventListener("pointerdown", () => {
  if (input.value.length === 5) { input.value = ""; show(""); }
});
window.addEventListener("pageshow", () => input.focus());

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js", { scope: "./" });
}
