<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#2a5fa8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PT Tracker">
  <title>PT Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <style>
    :root {
      --bg: #f4f6f9; --fg: #141a22; --muted: #5d6775; --card: #ffffff; --line: #d5dbe3;
      --accent: #2a5fa8; --accent-soft: #e3ecf8; --done: #2e9d55; --done-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1318; --fg: #e9edf2; --muted: #9aa5b3; --card: #1a2029; --line: #2e3744;
        --accent: #6fa3ec; --accent-soft: #1d2b40; --done: #34b363; --done-fg: #ffffff;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 17px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      -webkit-tap-highlight-color: transparent;
    }
    main, footer { max-width: 560px; margin: 0 auto; }
    button { font: inherit; color: inherit; cursor: pointer; }
    h1 { font-size: 30px; margin: 8px 0 2px; }
    .sub { color: var(--muted); margin: 0 0 18px; }

    /* Sessions screen */
    .cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .card {
      width: 100%; min-height: 72px; display: flex; align-items: center; gap: 12px;
      text-align: left; padding: 14px 16px; border-radius: 14px;
      background: var(--card); border: 2px solid var(--line);
    }
    .card .text { flex: 1; min-width: 0; }
    .card .name { font-weight: 600; font-size: 19px; }
    .card .meta { color: var(--muted); font-size: 15px; }
    .card .end { color: var(--muted); font-size: 22px; flex: none; }
    .card.next { border-color: var(--accent); background: var(--accent-soft); }
    .badge {
      display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 99px;
      background: var(--accent); color: #fff; font-size: 12px; font-weight: 600;
      vertical-align: 2px;
    }
    @media (prefers-color-scheme: dark) { .badge { color: #0f1318; } }
    .card.done { opacity: .45; }
    .card.done .end { color: var(--done); }
    .reset {
      display: block; margin: 28px auto 0; min-height: 44px; padding: 10px 22px;
      border-radius: 12px; border: 1px solid var(--line); background: var(--card);
      color: #c0392b;
    }
    @media (prefers-color-scheme: dark) { .reset { color: #ff7b6e; } }

    /* Exercise screen */
    .back {
      background: none; border: 0; padding: 10px 4px; margin-left: -4px; min-height: 44px;
      color: var(--accent); font-size: 17px;
    }
    .grid-head, .row {
      display: grid; grid-template-columns: 1fr 60px 60px; gap: 10px; align-items: center;
    }
    .grid-head {
      color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
      padding: 0 12px 6px; border-bottom: 1px solid var(--line);
    }
    .grid-head span:not(:first-child) { text-align: center; }
    .rows { list-style: none; margin: 0; padding: 0; }
    .row { padding: 10px 12px; border-bottom: 1px solid var(--line); }
    .row .ex { font-size: 16px; line-height: 1.3; }
    .row .reps { display: block; color: var(--muted); font-size: 14px; }
    .set {
      width: 60px; height: 60px; border-radius: 12px; border: 2px solid var(--line);
      background: var(--card); font-size: 26px; font-weight: 700; padding: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .set.on { background: var(--done); border-color: var(--done); color: var(--done-fg); }
    .set.empty { visibility: hidden; }

    footer { color: var(--muted); font-size: 13px; text-align: center; margin-top: 28px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <section id="home">
      <h1>Today's PT</h1>
      <p class="sub" id="home-sub"></p>
      <ul class="cards" id="cards"></ul>
      <button class="reset" id="reset" type="button">Reset sessions</button>
    </section>

    <section id="session" hidden>
      <button class="back" id="back" type="button">‹ Sessions</button>
      <h1 id="s-title"></h1>
      <p class="sub" id="s-sub"></p>
      <div class="grid-head"><span>Exercise</span><span>Set 1</span><span>Set 2</span></div>
      <ul class="rows" id="rows"></ul>
    </section>
  </main>
  <footer>PT Tracker v<span id="ver"></span></footer>

  <script>
// ===================== EXERCISE DATA — edit here =====================
// Odd sessions (1, 3, 5) use ODD; even sessions (2, 4) use EVEN.
// Progress is saved by exercise name, so renaming an exercise clears
// its checkmarks for today (nothing else breaks).
// If "sets" ever goes above 2, also add a column header in the HTML.
const ODD = [
  { name: "Seated elbow bend & straighten (no hand, thumb up)",         sets: 2, reps: 10 },
  { name: "Standing elbow bend & straighten (hand, palm up)",           sets: 2, reps: 10 },
  { name: "Seated elbow bend & straighten (hand, palm up, elbow on table)", sets: 2, reps: 10 },
  { name: "Seated wrist flex (hand, palm down, hold)",                  sets: 2, reps: 10 },
  { name: "Seated wrist extension stretch (hand, palm up, hold)",       sets: 2, reps: 10 },
  { name: "Tendon glides (left hand, palm out)",                        sets: 2, reps: 10 },
  { name: "Finger roll stretch (palm up)",                              sets: 2, reps: 10 },
  { name: "Finger extension (palm down on table)",                      sets: 2, reps: 10 },
];
const EVEN = [
  { name: "Seated elbow bend & straighten (no hand, thumb up)",         sets: 2, reps: 10 },
  { name: "Standing elbow bend & straighten (hand, palm up)",           sets: 2, reps: 10 },
  { name: "Seated elbow bend & straighten (hand, palm up, elbow on table)", sets: 2, reps: 10 },
  { name: "Tendon glides (left hand, palm out)",                        sets: 2, reps: 10 },
  { name: "Finger extension (palm down on table)",                      sets: 2, reps: 10 },
];
const SESSION_COUNT = 5;
const DEFAULT_REPS = 10;
// ====================================================================

const VERSION = "1.0";   // keep in step with sw.js
const KEY = "pt-tracker-progress";

const $ = id => document.getElementById(id);
const listFor = n => (n % 2 ? ODD : EVEN);

// progress = { "1": { "<exercise name>": [true, false] }, ... }
function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}
let progress = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch {}
}

// Only counts sets for exercises in the current list, so stale entries are ignored.
const isDone = (n, ex, i) => !!progress[n]?.[ex.name]?.[i];
function counts(n) {
  let done = 0, total = 0;
  for (const ex of listFor(n)) for (let i = 0; i < ex.sets; i++) { total++; if (isDone(n, ex, i)) done++; }
  return { done, total };
}

let current = null;   // open session number, or null for home

function renderHome() {
  const cards = $("cards");
  cards.innerHTML = "";
  let finished = 0, nextMarked = false;
  for (let n = 1; n <= SESSION_COUNT; n++) {
    const { done, total } = counts(n);
    const complete = done === total;
    if (complete) finished++;
    const isNext = !complete && !nextMarked;
    if (isNext) nextMarked = true;

    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.className = "card" + (complete ? " done" : isNext ? " next" : "");
    const meta = complete ? "Done"
      : done > 0 ? `${done} of ${total} sets`
      : `${listFor(n).length} exercises`;
    b.innerHTML = `<span class="text"><span class="name">Session ${n}</span>` +
      (isNext ? `<span class="badge">Up next</span>` : "") +
      `<br><span class="meta">${meta}</span></span>` +
      `<span class="end" aria-hidden="true">${complete ? "✓" : "›"}</span>`;
    b.addEventListener("click", () => show(n));
    li.appendChild(b);
    cards.appendChild(li);
  }
  $("home-sub").textContent = `${finished} of ${SESSION_COUNT} sessions done`;
}

function renderSession(n) {
  $("s-title").textContent = `Session ${n}`;
  const { done, total } = counts(n);
  $("s-sub").textContent = `${done} of ${total} sets · ${DEFAULT_REPS} reps each`;
  const rows = $("rows");
  rows.innerHTML = "";
  for (const ex of listFor(n)) {
    const li = document.createElement("li");
    li.className = "row";
    const label = document.createElement("span");
    label.className = "ex";
    label.textContent = ex.name;
    if (ex.reps !== DEFAULT_REPS) {
      const r = document.createElement("span");
      r.className = "reps";
      r.textContent = `${ex.reps} reps`;
      label.appendChild(r);
    }
    li.appendChild(label);
    for (let i = 0; i < Math.max(2, ex.sets); i++) {
      const b = document.createElement("button");
      b.type = "button";
      if (i >= ex.sets) { b.className = "set empty"; b.tabIndex = -1; li.appendChild(b); continue; }
      const on = isDone(n, ex, i);
      b.className = "set" + (on ? " on" : "");
      b.textContent = on ? "✓" : "";
      b.setAttribute("aria-label", `${ex.name}, set ${i + 1}, ${on ? "done" : "not done"}`);
      b.addEventListener("click", () => toggle(n, ex, i));
      li.appendChild(b);
    }
    rows.appendChild(li);
  }
}

function toggle(n, ex, i) {
  const s = (progress[n] ||= {});
  const sets = (s[ex.name] ||= []);
  sets[i] = !sets[i];
  save();
  const { done, total } = counts(n);
  if (sets[i] && done === total) show(null);   // last set done → straight back
  else renderSession(n);
}

function show(n) {
  current = n;
  $("home").hidden = n !== null;
  $("session").hidden = n === null;
  if (n === null) renderHome(); else renderSession(n);
  window.scrollTo(0, 0);
}

$("back").addEventListener("click", () => show(null));
$("reset").addEventListener("click", () => {
  if (!confirm("Reset all sessions?")) return;
  progress = {};
  save();
  renderHome();
});
// Another tab/window changing progress (rare) — stay in sync.
window.addEventListener("storage", e => {
  if (e.key === KEY) { progress = load(); show(current); }
});

$("ver").textContent = VERSION;
show(null);

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js", { scope: "./" });
}
  </script>
</body>
</html>
